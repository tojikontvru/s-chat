name: Build S Chat APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'foss'
        type: choice
        options:
          - foss
          - gplay
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME=$(grep 'versionName "' build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "=== S Chat Build ==="
          echo "Version: $VERSION_NAME (code: $VERSION_CODE)"
          echo "Flavor: ${{ github.event.inputs.flavor || 'foss' }}"
          echo "Build type: ${{ github.event.inputs.build_type || 'debug' }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'foss' }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          ./gradlew assemble${FLAVOR^}${BUILD_TYPE^} --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: s-chat-v${{ steps.version.outputs.version_name }}-${{ github.event.inputs.build_type || 'debug' }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
